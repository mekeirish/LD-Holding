<!DOCTYPE html>
<html lang="fr-FR">
<head>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>

  <style>
    body { margin: 0; padding: 0; background-color: #0E1B2D; font-family: system-ui; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .app-bg {
      background:
        radial-gradient(120% 80% at 50% -10%, rgba(232, 240, 79, 0.10) 0%, rgba(232, 240, 79, 0.03) 35%, transparent 70%),
        radial-gradient(80% 60% at 100% 100%, rgba(61, 197, 157, 0.08) 0%, transparent 60%),
        #0E1B2D;
    }
    .card-glow {
      position: relative;
      transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
    }
    .card-glow:hover,
    .card-glow:focus-visible {
      border-color: rgba(232, 240, 79, 0.55);
      box-shadow:
        0 10px 30px -12px rgba(232, 240, 79, 0.35),
        0 0 0 1px rgba(232, 240, 79, 0.15) inset;
      transform: translateY(-2px);
    }
    .card-glow:active {
      transform: scale(0.985);
    }
    .grid-stagger > * {
      animation: slideUp 0.35s ease-out both;
    }
    .grid-stagger > *:nth-child(1)  { animation-delay: 0ms; }
    .grid-stagger > *:nth-child(2)  { animation-delay: 40ms; }
    .grid-stagger > *:nth-child(3)  { animation-delay: 80ms; }
    .grid-stagger > *:nth-child(4)  { animation-delay: 120ms; }
    .grid-stagger > *:nth-child(5)  { animation-delay: 160ms; }
    .grid-stagger > *:nth-child(6)  { animation-delay: 200ms; }
    .grid-stagger > *:nth-child(7)  { animation-delay: 240ms; }
    .grid-stagger > *:nth-child(8)  { animation-delay: 280ms; }
    .grid-stagger > *:nth-child(n+9){ animation-delay: 320ms; }
    .cart-bar {
      background: linear-gradient(180deg, rgba(26, 42, 63, 0.85) 0%, rgba(14, 27, 45, 0.9) 100%);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(232, 240, 79, 0.18);
      box-shadow:
        0 -6px 24px rgba(0, 0, 0, 0.35),
        0 0 0 1px rgba(255, 255, 255, 0.03) inset;
      transition: opacity 0.25s ease, filter 0.25s ease, border-color 0.25s ease;
    }
.cart-bar.is-empty {
  display: none;
}
    .cart-bar .cart-cta {
      background: linear-gradient(135deg, #E8F04F 0%, #3DC59D 100%);
      color: #0E1B2D;
      box-shadow: 0 4px 14px -4px rgba(232, 240, 79, 0.55);
      transition: transform 0.15s ease, box-shadow 0.2s ease, filter 0.2s ease;
    }
    .cart-bar .cart-cta:hover {
      filter: brightness(1.08);
      box-shadow: 0 6px 18px -4px rgba(232, 240, 79, 0.7);
    }
    .cart-bar .cart-cta:active {
      transform: scale(0.96);
    }
.header-glass {
  position: sticky;
  top: 0;
  z-index: 20;
  margin: -20px -20px 16px -20px;
  padding: calc(20px + env(safe-area-inset-top, 0px)) 20px 12px 20px;
  background: linear-gradient(180deg, rgba(14, 27, 45, 0.92) 0%, rgba(14, 27, 45, 0.7) 70%, transparent 100%);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}
    .btn-shine {
      position: relative;
      overflow: hidden;
    }
    .btn-shine::after {
      content: "";
      position: absolute;
      top: 0;
      left: -120%;
      width: 60%;
      height: 100%;
      background: linear-gradient(120deg, transparent 0%, rgba(255, 255, 255, 0.35) 50%, transparent 100%);
      transition: left 0.6s ease;
      pointer-events: none;
    }
    .btn-shine:hover::after {
      left: 130%;
    }
    .client-empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 48px 16px;
      color: #9CA3AF;
      font-size: 14px;
      gap: 8px;
    }
    .client-empty .client-empty-icon {
      font-size: 32px;
      opacity: 0.5;
    }
    .skeleton {
      position: relative;
      overflow: hidden;
      background: #1E2F44;
      border-radius: 16px;
    }
    .skeleton::after {
      content: "";
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent 0%, rgba(232, 240, 79, 0.08) 50%, transparent 100%);
      animation: skeletonShimmer 1.4s infinite;
    }
    @keyframes skeletonShimmer {
      0%   { left: -100%; }
      100% { left: 100%; }
    }
    .skeleton-text {
      height: 12px;
      margin-top: 8px;
      border-radius: 6px;
    }
    @keyframes productPop {
      0%   { opacity: 0; transform: scale(0.85); }
      60%  { opacity: 1; transform: scale(1.04); }
      100% { opacity: 1; transform: scale(1); }
    }
    .product-pop {
      animation: productPop 0.45s ease-out;
    }
.product-thumbs {
  display: flex;
  justify-content: center;
  gap: 8px;
  overflow-x: auto;
  overflow-y: hidden;
  padding: 8px 4px 12px 4px;
  margin: 0 -4px 8px -4px;
  scroll-snap-type: x proximity;
  -webkit-overflow-scrolling: touch;
}
.product-thumb {
  flex: 0 0 auto;
  width: 56px;
  height: 56px;
  border-radius: 10px;
  overflow: hidden;
  background: #1E2F44;
  border: 1px solid #3A4A5F;
  padding: 0;
  cursor: pointer;
  scroll-snap-align: start;
  transition: border-color 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease;
}
.product-thumb:hover,
.product-thumb:focus-visible {
  border-color: rgba(232, 240, 79, 0.65);
  box-shadow: 0 0 0 2px rgba(232, 240, 79, 0.2);
  outline: none;
}
.product-thumb:active {
  transform: scale(0.94);
}
.product-thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.product-thumb-placeholder {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  height: 100%;
  font-size: 20px;
  color: #9CA3AF;
}
.product-detail-placeholder {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  height: 100%;
  font-size: 64px;
  opacity: 0.55;
}
.product-thumb.is-active {
  border-color: #E8F04F;
  box-shadow: 0 0 0 2px rgba(232, 240, 79, 0.45);
  opacity: 1;
  cursor: default;
}
.product-thumb:not(.is-active) {
  opacity: 0.85;
}
.product-thumb:not(.is-active):hover,
.product-thumb:not(.is-active):focus-visible {
  opacity: 1;
}
.product-brand-chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 4px 10px;
  margin-top: 2px;
  border-radius: 999px;
  background: rgba(232, 240, 79, 0.1);
  border: 1px solid rgba(232, 240, 79, 0.35);
  color: #E8F04F;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  cursor: pointer;
  transition: background 0.2s ease, border-color 0.2s ease, transform 0.15s ease;
}
.product-brand-chip:hover {
  background: rgba(232, 240, 79, 0.22);
  border-color: rgba(232, 240, 79, 0.65);
}
.product-brand-chip:active {
  transform: scale(0.96);
}
.qty-quick-row {
  display: flex;
  gap: 6px;
  width: 100%;
}
.qty-quick-btn {
  flex: 1 1 0;
  height: 32px;
  padding: 0;
  border-radius: 8px;
  background: #0E1B2D;
  border: 1px solid #3A4A5F;
  color: #CBD5E1;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.15s ease;
  display: flex;
  align-items: center;
  justify-content: center;
}
.qty-quick-btn:hover {
  background: #253a55;
  color: #E8F04F;
  border-color: rgba(232, 240, 79, 0.5);
}
.qty-quick-btn:active {
  transform: scale(0.94);
}
.qty-quick-btn.is-active {
  background: #E8F04F;
  color: #0E1B2D;
  border-color: #E8F04F;
  box-shadow: 0 2px 8px -2px rgba(232, 240, 79, 0.4);
}
.image-fullscreen-overlay {
  position: fixed;
  inset: 0;
  z-index: 200;
  background: rgba(14, 27, 45, 0.95);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  animation: fadeIn 0.2s ease-out;
  cursor: zoom-out;
}
.image-fullscreen-overlay img {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
  border-radius: 12px;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
  animation: scaleIn 0.25s ease-out;
}
.image-fullscreen-close {
  position: absolute;
  top: 16px;
  right: 16px;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: rgba(30, 47, 68, 0.8);
  border: 1px solid #3A4A5F;
  color: #F0F4F8;
  font-size: 18px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.2s ease, color 0.2s ease, transform 0.15s ease;
}
.image-fullscreen-close:hover {
  background: rgba(232, 240, 79, 0.22);
  color: #E8F04F;
}
    @keyframes qtyFlash {
      0%   { box-shadow: 0 0 0 0 rgba(232, 240, 79, 0.45); }
      100% { box-shadow: 0 0 0 0 rgba(232, 240, 79, 0); }
    }
    .qty-flash {
      animation: qtyFlash 0.35s ease-out;
    }
    @keyframes qtyBump {
      0%   { transform: scale(1); }
      45%  { transform: scale(1.22); box-shadow: 0 0 0 4px rgba(232, 240, 79, 0.25); }
      100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(232, 240, 79, 0); }
    }
    .qty-bump-up {
      animation: qtyBump 0.3s ease-out;
    }
    @keyframes qtyBumpDown {
      0%   { transform: scale(1); }
      45%  { transform: scale(0.8); box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.2); }
      100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }
    .qty-bump-down {
      animation: qtyBumpDown 0.3s ease-out;
    }
    .breadcrumb-avatar {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid rgba(232, 240, 79, 0.5);
      flex-shrink: 0;
    }
    .ripple-host {
      position: relative;
      overflow: hidden;
    }
    .ripple-host .ripple {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      background: rgba(255, 255, 255, 0.35);
      transform: scale(0);
      animation: rippleAnim 0.55s ease-out forwards;
    }
    @keyframes rippleAnim {
      to {
        transform: scale(2.2);
        opacity: 0;
      }
    }
    @keyframes shakeX {
      0%, 100% { transform: translateX(0); }
      20%      { transform: translateX(-6px); }
      40%      { transform: translateX(6px); }
      60%      { transform: translateX(-4px); }
      80%      { transform: translateX(4px); }
    }
    .shake {
      animation: shakeX 0.4s ease-in-out;
    }
    .collapse-out {
      max-height: 400px;
      overflow: hidden;
      transition: max-height 0.35s ease, opacity 0.25s ease, margin 0.3s ease, padding 0.3s ease, transform 0.25s ease;
    }
    .collapse-out.is-collapsing {
      max-height: 0;
      opacity: 0;
      margin-top: 0 !important;
      margin-bottom: 0 !important;
      padding-top: 0 !important;
      padding-bottom: 0 !important;
      transform: scale(0.96);
    }
    .admin-btn {
      transition: transform 0.15s ease, box-shadow 0.2s ease, filter 0.2s ease;
    }
    .admin-btn:hover {
      transform: translateY(-1px);
    }
    .admin-btn:active {
      transform: translateY(1px) scale(0.99);
    }
    .admin-btn.is-flash-success {
      box-shadow: 0 0 0 3px rgba(61, 197, 157, 0.55);
    }
    .admin-btn.is-flash-error {
      box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.55);
    }
    @keyframes viewEnterRight {
      from { opacity: 0; transform: translateX(24px); }
      to   { opacity: 1; transform: translateX(0); }
    }
    @keyframes viewEnterLeft {
      from { opacity: 0; transform: translateX(-24px); }
      to   { opacity: 1; transform: translateX(0); }
    }
    .view-enter-right {
      animation: viewEnterRight 0.32s ease-out both;
    }
    .view-enter-left {
      animation: viewEnterLeft 0.32s ease-out both;
    }
    .hash-copy {
      cursor: pointer;
      border-radius: 4px;
      padding: 1px 4px;
      transition: background 0.2s ease, color 0.2s ease;
    }
    .hash-copy:hover {
      background: rgba(232, 240, 79, 0.1);
      color: #E8F04F;
    }
    .hash-copy.is-copied {
      background: rgba(61, 197, 157, 0.2);
      color: #3DC59D;
    }
    .cart-item-thumb {
      width: 44px;
      height: 44px;
      flex-shrink: 0;
      border-radius: 10px;
      overflow: hidden;
      background: #0E1B2D;
      border: 1px solid #3A4A5F;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }
    .cart-item-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .cart-qty-btn {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 13px;
      background: #1E2F44;
      color: #E8F04F;
      border: 1px solid #3A4A5F;
      transition: background 0.15s ease, transform 0.1s ease;
      cursor: pointer;
      user-select: none;
    }
    .cart-qty-btn:hover {
      background: #253a55;
    }
    .cart-qty-btn:active {
      transform: scale(0.9);
    }
    .cart-qty-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      pointer-events: none;
    }
    @keyframes cartSuccessIn {
      from { opacity: 0; transform: scale(0.9); }
      to   { opacity: 1; transform: scale(1); }
    }
    .cart-success {
      animation: cartSuccessIn 0.35s ease-out;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 32px 16px;
      gap: 12px;
    }
    .cart-success-icon {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: rgba(61, 197, 157, 0.15);
      border: 2px solid #3DC59D;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      color: #3DC59D;
      animation: cartSuccessIn 0.4s ease-out 0.1s both;
    }
    .cart-success-title {
      color: #E8F04F;
      font-weight: 700;
      font-size: 16px;
    }
    .cart-success-sub {
      color: #9CA3AF;
      font-size: 13px;
    }
.breadcrumb {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-top: 8px;
  padding: 4px 10px 4px 6px;
  border-radius: 999px;
  background: rgba(30, 47, 68, 0.6);
  border: 1px solid rgba(58, 74, 95, 0.8);
  color: #9CA3AF;
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  cursor: pointer;
  max-width: 100%;
  overflow: hidden;
  transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease, transform 0.15s ease;
}
.breadcrumb > span:last-child {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  min-width: 0;
}
    .breadcrumb:hover {
      background: rgba(232, 240, 79, 0.08);
      color: #E8F04F;
      border-color: rgba(232, 240, 79, 0.4);
    }
    .breadcrumb:active {
      transform: scale(0.97);
    }
    .breadcrumb .breadcrumb-arrow {
      color: #E8F04F;
      font-size: 12px;
      line-height: 1;
    }
    @keyframes cartBadgePulse {
      0%   { transform: scale(1);   box-shadow: 0 0 0 0 rgba(232, 240, 79, 0.55); }
      40%  { transform: scale(1.35); box-shadow: 0 0 0 8px rgba(232, 240, 79, 0); }
      100% { transform: scale(1);   box-shadow: 0 0 0 0 rgba(232, 240, 79, 0); }
    }
    .cart-badge-pulse {
      animation: cartBadgePulse 0.6s ease-out;
    }
    .cart-total {
      background: linear-gradient(135deg, rgba(232, 240, 79, 0.12) 0%, rgba(61, 197, 157, 0.12) 100%);
      border: 1px solid rgba(232, 240, 79, 0.25);
      border-radius: 12px;
      padding: 10px 14px;
      margin-top: 8px;
    }
    .cart-total .cart-total-label {
      color: #9CA3AF;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-weight: 600;
    }
    .cart-total .cart-total-value {
      color: #E8F04F;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.01em;
      text-shadow: 0 0 20px rgba(232, 240, 79, 0.25);
    }
    @keyframes toastOut {
      from { opacity: 1; transform: translate(-50%, 0); }
      to   { opacity: 0; transform: translate(-50%, 12px); }
    }
.toast-out {
  animation: toastOut 0.25s ease-in forwards;
}
.toast-host {
  bottom: 6rem;
}
    #root { width: 100%; display: flex; justify-content: center; align-items: center; }
    ::-webkit-scrollbar { display: none; }
    input, select, textarea { background-color: #1E2F44; color: #F0F4F8; border-color: #3A4A5F; }

.form-label {
  display: block;
  font-size: 11px;
  font-weight: 600;
  color: #9CA3AF;
  text-transform: uppercase;
  letter-spacing: 0.06em;

}
.image-fullscreen-close:focus-visible {
  outline: 2px solid #E8F04F;
  outline-offset: 2px;
}

    input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }

    .modal-overlay { animation: fadeIn 0.25s ease-out; }
.modal-content { animation: scaleIn 0.25s ease-out; }
.modal-content.modal-product-detail-shell {
  padding: 0;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  max-height: 96vh;
}

  padding: 16px 16px 8px 16px;

  flex-shrink: 0;

.product-detail-image {

  display: flex;
  flex-direction: column;
  align-items: center;

}

  border-radius: 16px;

.product-detail-qty {
  margin-bottom: 6px;

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes scaleIn { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        const y = e.clientY - rect.top - size / 2;
        const id = ++rippleIdRef.current;
        setRipples(prev => [...prev, { id, x, y, size }]);

            canvas.width = canvas.height = size;
            const ctx = canvas.getContext("2d");
            const ratio = Math.max(size / img.width, size / img.height);
            const w = img.width * ratio, h = img.height * ratio;
            ctx.drawImage(img, (size - w) / 2, (size - h) / 2, w, h);
            onUpload(canvas.toDataURL("image/jpeg", 0.9));
          };
          img.src = event.target.result;

      const getOrderTimestamp = (order) => {
        if (!order) return null;
        if (typeof order.timestamp === 'number' && order.timestamp > 0) {
          return new Date(order.timestamp);
        }
        if (!order.date) return null;
        let s = String(order.date)
          .replace(/[\u200e\u200f\u202a-\u202e\u2066-\u2069]/g, '')
          .replace(/\u00a0/g, ' ');
        if (/^\d{4}-\d{2}-\d{2}/.test(s.trim())) {
          const d = new Date(s);
          if (!isNaN(d.getTime())) return d;
        }
        s = s.replace(/م/g, 'PM').replace(/ص/g, 'AM');
        const dateMatch = s.match(/(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})/);
        if (!dateMatch) {
          const d = new Date(s);
          return isNaN(d.getTime()) ? null : d;
        }
        const na = parseInt(dateMatch[1], 10);
        const nb = parseInt(dateMatch[2], 10);
        const year = parseInt(dateMatch[3], 10);
        let day, month;
        if (na > 12 && nb <= 12) {
          day = na; month = nb;
        } else if (nb > 12 && na <= 12) {
          day = nb; month = na;
        } else {
          day = na; month = nb;
        }
        const timeMatch = s.match(/(\d{1,2}):(\d{2})(?::(\d{2}))?/);
        let hour = 0, minute = 0, second = 0;
        if (timeMatch) {
          hour = parseInt(timeMatch[1], 10);
          minute = parseInt(timeMatch[2], 10);
          second = parseInt(timeMatch[3] || '0', 10);
        }
        const upper = s.toUpperCase();
        if (/PM/.test(upper) && hour < 12) hour += 12;
        if (/AM/.test(upper) && hour === 12) hour = 0;
        if (month < 1 || month > 12 || day < 1 || day > 31) return null;
        const d = new Date(year, month - 1, day, hour, minute, second);
        return isNaN(d.getTime()) ? null : d;
      };

      const uploadToImgbb = async (dataUrl) => {

function getSiblingProducts(product, products) {
  if (!product || !Array.isArray(products)) return [];

  const pName = String(product.name || '');
  const targetWords = extractKeywords(pName);
  
  // Si le produit cible n'a pas de nom propre/marque à comparer, on ne recommande rien
  if (targetWords.length === 0) return [];

  const out = [];
  for (const p of products) {
    if (!p || p === product || p.id === product.id) continue;

    // RÈGLE : On n'affiche que les produits qui ont une photo
    if (!p.image) continue;

    const cWords = extractKeywords(p.name);
    
    let hasCommon = false;
    for (const w of cWords) {
      if (targetWords.includes(w)) { hasCommon = true; break; }
    }

    if (hasCommon) {
      out.push(p);
    }
  }
  return out;
}
function extractKeywords(name) {
  if (name == null) return [];
  
  // Liste des mots courants (noms communs, verbes, adjectifs) à ignorer pour ne garder que les noms propres
  const DICTIONARY = new Set([
    'linge', 'gel', 'couleur', 'parfum', 'savon', 'liquide', 'poudre', 'capsule', 'tablette', 'spray', 
    'deodorant', 'desodorisant', 'sanitaire', 'wc', 'toilette', 'vaisselle', 'lessive', 'adoucissant', 
    'nettoyant', 'detergent', 'produit', 'maison', 'cuisine', 'salle', 'bain', 'sol', 'surface', 
    'textile', 'tissu', 'main', 'corps', 'cheveux', 'visage', 'peau', 'creme', 'lait', 'huile', 
    'shampooing', 'apres', 'avant', 'soin', 'anti', 'tache', 'odeur', 'propre', 'eclat', 'brillant', 
    'doux', 'fort', 'concentre', 'diluer', 'usage', 'exterieur', 'interieur', 'multi', 'super', 
    'extra', 'max', 'mini', 'ultra', 'hyper', 'pack', 'unite', 'litre', 'gramme', 'ml', 'cl', 
    'bouteille', 'flacon', 'boite', 'sachet', 'recharge', 'promo', 'offre', 'gratuit', 'nouveau',
    
    // Tes exceptions (couleurs, genres, textures)
    'noir', 'noire', 'blanc', 'blanche', 'rouge', 'red', 'vert', 'verte', 'green', 'bleu', 'bleue', 
    'blue', 'jaune', 'yellow', 'rose', 'pink', 'violet', 'violette', 'pourpre', 'orange', 'marron', 
    'gris', 'grise', 'beige', 'velvet', 'gold', 'silver', 'homme', 'femme', 'men', 'women', 'unisexe', 
    'mixte', 'garcon', 'fille', 'oud', 'skin', 'soft', 'crystal', 'smooth', 'dry', 'fresh', 'sec'
  ]);

  const tokens = String(name)
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .toLowerCase()
    .replace(/[\s\u00A0\u202F]+/g, ' ')
    .trim()
    .split(' ');
    
  const words = new Set();
  for (const raw of tokens) {
    if (!raw) continue;
    if (/\d/.test(raw)) continue;
    
    const s = raw.replace(/^[^a-z]+|[^a-z]+$/g, '');
    if (s.length < 3) continue;
    if (!/^[a-z]+$/.test(s)) continue;
    
    // Si le mot est dans le dictionnaire ou la liste noire, on l'ignore
    if (DICTIONARY.has(s)) continue; 
    
    words.add(s);
  }
  return [...words];
}
function normalizeBrand(brand) {
  if (brand == null) return '';
  return String(brand).trim().toLowerCase();
}
function getRecommendations(product, catalog, options) {
  const opts = options || {};
  const cfg = {
    name: opts.name || 'name',
    brand: opts.brand || 'brand', // Si tu utilises brandId, passe l'option { brand: 'brandId' }
    id: opts.id || 'id'
  };

  if (!product || !Array.isArray(catalog) || catalog.length === 0) return [];

  // SÉCURITÉ 1 : Si le produit source n'a pas de marque, on arrête tout (pas de reco à l'aveugle)
  const targetBrand = normalizeBrand(product[cfg.brand]);
  if (!targetBrand) return [];

  const targetWords = new Set(extractKeywords(product[cfg.name]));
  // SÉCURITÉ 2 : Si le nom du produit source ne donne aucun mot valide, on arrête tout
  if (targetWords.size === 0) return [];

  const out = [];
  for (const p of catalog) {
    if (!p) continue;
    if (p === product) continue;
    if (p[cfg.id] != null && p[cfg.id] === product[cfg.id]) continue;

    // SÉCURITÉ 3 : La marque candidate doit exister ET être strictement identique
    const candidateBrand = normalizeBrand(p[cfg.brand]);
    if (!candidateBrand || candidateBrand !== targetBrand) continue;

    const candidateWords = extractKeywords(p[cfg.name]);
    // SÉCURITÉ 4 : Le candidat doit avoir au moins un mot valide
    if (candidateWords.length === 0) continue;

    // SÉCURITÉ 5 : Intersection stricte (au moins 1 mot en commun)
    const shared = candidateWords.filter(function (w) {
      return targetWords.has(w);
    });
    if (shared.length === 0) continue;

    out.push({ product: p, score: shared.length, commonWords: shared });
  }

  out.sort(function (a, b) {
    return b.score - a.score
      || String(a.product[cfg.name]).localeCompare(String(b.product[cfg.name]), 'fr');
  });
  
  return out;
}
