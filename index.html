  transition: transform 0.5s cubic-bezier(0.2, 0.7, 0.2, 1);
}

.tabular {
  font-variant-numeric: tabular-nums;
}
@keyframes shimmer {
  0% { background-position: -200% 0; }
  100% { background-position: 200% 0; }
}

}
@keyframes staggerIn {
  from { opacity: 0; translate: 0 10px; }
  to { opacity: 1; translate: 0 0; }
}

@keyframes badgeBounce {

  60% { transform: scale(0.9); }

  animation: badgeBounce 0.45s ease-out;

    const ImageUpload = ({ onUpload }) => {
      const handleChange = e => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = event => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement("canvas");
            const size = 300;
            canvas.width = canvas.height = size;
            const ctx = canvas.getContext("2d");
            const ratio = Math.max(size / img.width, size / img.height);
            const w = img.width * ratio, h = img.height * ratio;
            ctx.drawImage(img, (size - w) / 2, (size - h) / 2, w, h);
            onUpload(canvas.toDataURL("image/jpeg", 0.9));
          };
          img.src = event.target.result;
        };
        reader.readAsDataURL(file);
      };
      return React.createElement("input", {

const ProductCard = ({ product, onClick, showPrices, selectable, selected, inGroup }) =>

                const canvas = document.createElement("canvas");
                let width = img.width, height = img.height;
                if (width > maxWidth) { height = (height * maxWidth) / width; width = maxWidth; }
                canvas.width = width; canvas.height = height;
                const ctx = canvas.getContext("2d");
                ctx.drawImage(img, 0, 0, width, height);
                resolve(canvas.toDataURL("image/png"));

              img.onerror = () => reject(new Error("Erreur chargement image"));

            className: "flex items-center gap-2 p-1.5 rounded-full bg-[#13233A]/85 backdrop-blur-xl border border-white/[0.08] shadow-[0_16px_32px_-12px_rgba(3,8,18,0.85)]"
          },
            isSelectingProducts
              ? React.createElement("button", {
                  onClick: handleValidateCompilation,
                  className: "tabular flex-1 py-2.5 rounded-full font-semibold text-sm text-[#0E1B2D] bg-gradient-to-b from-[#EEF47A] to-[#DCE446] shadow-[inset_0_1px_0_rgba(255,255,255,0.45)] active:scale-95 transition"
                }, `Valider (${selectedForCompilation.length})`)
              : React.createElement("button", {
                  onClick: handleAddCompilation,
                  className: "flex-1 py-2.5 rounded-full font-semibold text-sm text-[#0E1B2D] bg-gradient-to-b from-[#EEF47A] to-[#DCE446] shadow-[inset_0_1px_0_rgba(255,255,255,0.45)] active:scale-95 transition"
                }, "+ Ajouter"),
            isSelectingProducts && React.createElement("button", {
              onClick: handleCancelCompilation,
              className: "py-2.5 px-3.5 rounded-full text-sm font-semibold bg-white/[0.05] text-[#F0F4F8] border border-white/10 hover:bg-white/[0.08] active:scale-95 transition"
            }, "✕"),
            React.createElement("button", {
              onClick: () => setModals(prev => ({ ...prev, compilations: true })),
              className: "tabular flex-1 py-2.5 rounded-full font-semibold text-sm text-[#7FDCC0] bg-[#3DC59D]/10 border border-[#3DC59D]/25 hover:bg-[#3DC59D]/15 active:scale-95 transition"
            }, brandCompilationGroups.length > 0 ? `Compilations (${brandCompilationGroups.length})` : "Compilations")
          )
        );
      };

      if (loading) {
        return React.createElement("div", { className: "fixed inset-0 app-bg flex justify-center overflow-hidden" },
          React.createElement("div", { className: "w-full max-w-sm px-5 pt-6" },
            React.createElement("div", { className: "flex items-center justify-between mb-8" },
              React.createElement("div", { className: "skeleton h-10 w-28 rounded-xl" }),
              React.createElement("div", { className: "skeleton h-8 w-8 rounded-full" })
            ),
            React.createElement("div", { className: "skeleton h-3 w-20 rounded-full mb-4" }),
            React.createElement("div", { className: "grid grid-cols-2 gap-4" },
              [0, 1, 2, 3, 4, 5].map(i =>
                React.createElement("div", { key: i, className: "skeleton aspect-square rounded-2xl", style: { animationDelay: `${i * 80}ms` } })
              )
            )
          )
        );
      }

      return React.createElement("div", {
        className: "fixed inset-0 app-bg flex justify-center overflow-y-auto",
        style: compilationMode ? { boxShadow: 'inset 0 0 0 2px rgba(239,68,68,0.55)' } : undefined
      },
        React.createElement("div", { className: `w-full max-w-sm min-h-screen px-5 pb-28 transition-opacity duration-300 ${isTransitioning ? 'opacity-0' : 'opacity-100'}` },
          renderHeader(),
          currentView === DICT.VIEW.DASHBOARD
            ? ((isAdmin && !compilationMode) ? renderAdminDashboard() : renderBrandGrid())
            : renderProductGrid(),
          renderModals(),
          renderCompilationsModal(),
          renderSettingsModal()
        ),
        React.createElement(Toast, { message: toast.message, type: toast.type, onClose: hideToast }),
        renderPinModal(),
        renderAdminsModal(),
        renderDeleteAdminModal(),
        renderCartBar(),
        renderCompilationBar()
      );
    };

    window.reactRoot = window.reactRoot || ReactDOM.createRoot(document.getElementById('root'));
    window.reactRoot.render(React.createElement(App, null));
  </script>

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').then(reg => {
        reg.addEventListener('updatefound', () => {
          const installingWorker = reg.installing;
          installingWorker.addEventListener('statechange', () => {
            if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
              window.location.reload();
            }
          });
        });
      });
    }
  </script>
